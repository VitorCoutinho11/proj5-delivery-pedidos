version: "3.9"

services:
  delivery-pedidos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delivery-pedidos-container
    restart: unless-stopped

    ports:
      - "9523:9523"

    environment:
      PORT: 9523
      NODE_ENV: production

      # Banco de Dados — puxa direto do arquivo .env
      DATABASE_URL: ${DATABASE_URL}

      # RabbitMQ (com valor padrão caso não encontre no .env)
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://admin:admin@10.136.38.50:5672}
      RABBITMQ_RECONNECT_DELAY: ${RABBITMQ_RECONNECT_DELAY:-5000}

      # Regras de Negócio
      TAXA_ENTREGA_BASE: ${TAXA_ENTREGA_BASE:-5.00}

    networks:
      - delivery-net

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  delivery-net:
    name: delivery-net
    driver: bridge